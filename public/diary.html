<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1a1a2e">
<title>Site Diary</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f1a;
    color: #e0e0f0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #fff; }
  .sub { font-size: 13px; color: #888; margin-bottom: 28px; }

  #mic-btn {
    width: 140px; height: 140px;
    border-radius: 50%;
    border: none;
    background: #2563eb;
    color: #fff;
    font-size: 52px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 0 rgba(37,99,235,0.5);
    transition: background 0.2s, transform 0.1s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    margin-bottom: 18px;
  }
  #mic-btn.recording {
    background: #dc2626;
    animation: pulse 1.2s infinite;
  }
  #mic-btn:active { transform: scale(0.95); }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(220,38,38,0.6); }
    70%  { box-shadow: 0 0 0 24px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }

  #status {
    font-size: 15px; color: #aaa;
    min-height: 22px;
    margin-bottom: 20px;
    text-align: center;
  }
  #status.ok { color: #22c55e; }
  #status.err { color: #ef4444; }

  textarea {
    width: 100%; max-width: 460px;
    height: 110px;
    background: #1e1e30;
    border: 1px solid #333;
    border-radius: 10px;
    color: #e0e0f0;
    font-size: 15px;
    padding: 12px;
    resize: vertical;
    outline: none;
    margin-bottom: 14px;
  }
  textarea:focus { border-color: #2563eb; }

  #submit-btn {
    width: 100%; max-width: 460px;
    padding: 15px;
    background: #16a34a;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s;
  }
  #submit-btn:disabled { background: #374151; color: #6b7280; cursor: default; }
  #submit-btn:not(:disabled):active { background: #15803d; }

  #result {
    width: 100%; max-width: 460px;
    margin-top: 22px;
    background: #1e1e30;
    border: 1px solid #2d2d44;
    border-radius: 10px;
    padding: 16px;
    display: none;
  }
  #result h2 { font-size: 15px; color: #22c55e; margin-bottom: 12px; }
  .field { margin-bottom: 8px; font-size: 14px; }
  .label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .value { color: #e0e0f0; margin-top: 2px; }
  .badge {
    display: inline-block; padding: 2px 8px;
    border-radius: 12px; font-size: 12px; font-weight: 600;
  }
  .badge.High { background: #7f1d1d; color: #fca5a5; }
  .badge.Medium { background: #78350f; color: #fcd34d; }
  .badge.Low { background: #14532d; color: #86efac; }

  .actions-list { list-style: none; padding-left: 0; }
  .actions-list li::before { content: '→ '; color: #2563eb; }

  footer {
    margin-top: auto;
    padding-top: 30px;
    font-size: 12px;
    color: #444;
    text-align: center;
  }
</style>
</head>
<body>

<h1>📋 Site Diary</h1>
<p class="sub">Tap the mic, speak your note, tap again to stop.</p>

<button id="mic-btn" title="Hold to record">🎤</button>
<div id="status">Tap mic to record</div>

<textarea id="text-input" placeholder="Or type your note here…"></textarea>

<button id="submit-btn">Log Entry</button>

<div id="result">
  <h2>✓ Entry logged</h2>
  <div id="result-body"></div>
</div>

<footer>Site Diary v1 · Powered by Claude</footer>

<script>
const API = '/api/diary';

let mediaRecorder = null;
let chunks = [];
let recording = false;

const micBtn = document.getElementById('mic-btn');
const statusEl = document.getElementById('status');
const textInput = document.getElementById('text-input');
const submitBtn = document.getElementById('submit-btn');
const resultEl = document.getElementById('result');
const resultBody = document.getElementById('result-body');

function setStatus(msg, cls = '') {
  statusEl.textContent = msg;
  statusEl.className = cls;
}

micBtn.addEventListener('click', async () => {
  if (!recording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
        : MediaRecorder.isTypeSupported('audio/ogg') ? 'audio/ogg'
        : 'audio/mp4';

      mediaRecorder = new MediaRecorder(stream, { mimeType });
      chunks = [];

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        handleAudioChunks(mimeType);
      };

      mediaRecorder.start();
      recording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = '⏹️';
      setStatus('Recording… tap to stop');
    } catch (e) {
      setStatus('Mic access denied — type below instead', 'err');
    }
  } else {
    mediaRecorder.stop();
    recording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    setStatus('Processing audio…');
  }
});

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function handleAudioChunks(mimeType) {
  const blob = new Blob(chunks, { type: mimeType });
  // Whisper Bite 2: the capture switch (public/capture-stt.js). Flag ON
  // + engine ready → the phone transcribes and we post { text }; flag
  // OFF / engine unavailable / on-device failure → today's cloud audio
  // post, LABELLED in the status line — never a silent switch.
  try {
    const { buildCapturePost } = await import('./capture-stt.js');
    const post = await buildCapturePost(blob, {
      mimeType,
      encodeAudio: blobToBase64,
      onProgress: (p) => {
        if (p && p.fraction != null) setStatus(`Downloading on-device model… ${Math.round(p.fraction * 100)}%`);
      },
    });
    if (post.via === 'on_device') {
      // The transcript lands in the textarea (visible, editable) and is
      // posted as text — the handler prefers text and skips the cloud
      // transcription call entirely.
      textInput.value = post.payload.text;
      setStatus('Heard on this device ✓ — logging…');
    } else {
      setStatus(post.label);
    }
    submitEntry(post.payload);
  } catch (e) {
    console.warn('[diary] capture switch failed — cloud transcription:', e);
    setStatus('Sending audio for cloud transcription…');
    try {
      submitEntry({ audioBase64: await blobToBase64(blob), mimeType });
    } catch (err) {
      setStatus('Error: ' + err.message, 'err');
    }
  }
}

submitBtn.addEventListener('click', () => {
  const text = textInput.value.trim();
  if (!text) { setStatus('Type or record something first', 'err'); return; }
  submitEntry({ text });
});

textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); submitBtn.click(); }
});

async function submitEntry(payload) {
  submitBtn.disabled = true;
  setStatus('Sending to Claude…');
  resultEl.style.display = 'none';

  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await resp.json();

    if (!resp.ok || !data.ok) {
      throw new Error(data.error || `Server error ${resp.status}`);
    }

    const p = data.parsed || {};
    const logged = data.logged ? ' · Saved to Sheets ✓' : ' · (Sheets not connected)';

    setStatus('Entry logged!' + logged, 'ok');
    textInput.value = '';

    const actions = (p.action_items || []).map(a => `<li>${a}</li>`).join('');
    resultBody.innerHTML = `
      <div class="field"><div class="label">Date / Time</div><div class="value">${p.date || '—'} at ${p.time || '—'}</div></div>
      <div class="field"><div class="label">Location</div><div class="value">${p.location || '—'}</div></div>
      <div class="field"><div class="label">Category · Priority</div><div class="value">${p.category || '—'} · <span class="badge ${p.priority || 'Medium'}">${p.priority || 'Medium'}</span></div></div>
      <div class="field"><div class="label">Summary</div><div class="value">${p.summary || '—'}</div></div>
      <div class="field"><div class="label">Detail</div><div class="value">${p.detail || '—'}</div></div>
      ${actions ? `<div class="field"><div class="label">Action Items</div><ul class="actions-list">${actions}</ul></div>` : ''}
      <div class="field"><div class="label">Transcript</div><div class="value" style="color:#666;font-size:13px;">${data.transcript || ''}</div></div>
    `;
    resultEl.style.display = 'block';
    resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (err) {
    setStatus('Error: ' + err.message, 'err');
  } finally {
    submitBtn.disabled = false;
  }
}
</script>
</body>
</html>
